<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Acesso ao Sistema de Almoxarifado da sua empresa"
    />
    <title>Almoxarifado | sua empresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-page__shade" aria-hidden="true"></div>

      <section class="login-card" aria-labelledby="login-title">
        <header class="login-card__header">
          <h1 id="login-title">Almoxarifado</h1>
          <p>Entre com suas credenciais para continuar.</p>
        </header>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="username">Usuário</label>
            <div class="field__control">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"
                />
              </svg>
              <input
                id="username"
                name="username"
                type="text"
                placeholder="Digite seu usuário"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="field__control">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="4" y="10" width="16" height="11" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              />
              <button
                id="toggle-password"
                class="password-toggle"
                type="button"
                aria-label="Exibir senha"
                title="Exibir senha"
              >
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
              </button>
            </div>
          </div>

          <p
            id="form-message"
            class="form-message"
            role="alert"
            aria-live="polite"
          ></p>
          <button class="login-button" type="submit">
            <span>Entrar</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/ui-safety.js"></script>
    <script src="../scripts/login.js"></script>
  </body>
</html>
